[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steam-price-forecast"
version = "0.1.0"
description = "Previsão de descontos de jogos da Steam: coleta local, baselines e gradient boosting com avaliação temporal, quantis e interface demonstrativa. Inclui módulo secundário de itens do mercado."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = [
    "scikit-learn>=1.5",
]

[project.scripts]
steam-forecast = "steam_forecast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
